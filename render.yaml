# Render blueprint. It has to live at the REPOSITORY ROOT, which is where it
# now is — it used to sit inside EXTERIOR-AI/ while also declaring
# `rootDir: EXTERIOR-AI`, so Render would never have found it, and the disk
# mount path underneath assumed the layout it has from here.
#
# The app itself is in EXTERIOR-AI/. That is what rootDir points at, and it is
# why mountPath resolves through it.
#
# The disk is the part that matters. Without it Render gives you an ephemeral
# filesystem, and this app keeps leads, the detection records and the daily
# spend counter under data/ — all of which would vanish on every deploy and
# restart, silently.
services:
  - type: web
    name: facetpro
    runtime: node
    plan: starter          # a paid plan is required for a persistent disk
    rootDir: EXTERIOR-AI
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: false      # deploy deliberately, not on every push to main
    # One instance, deliberately. The write lock in store.js is per process, as
    # its own comment says, and the daily spend counter is a file. Two
    # instances would race on both — leads lost on one side, twice the API
    # bill on the other. Scaling out means a shared store first.
    numInstances: 1

    disk:
      name: facetpro-data
      mountPath: /opt/render/project/src/EXTERIOR-AI/data
      sizeGB: 1

    envVars:
      - key: NODE_VERSION
        value: "22"
      # Express serves its default error page — stack trace, absolute paths,
      # dependency versions — unless this is set. There is an error handler
      # now that catches those anyway, but belt and braces on the one that
      # leaks the deployment layout.
      - key: NODE_ENV
        value: production
      - key: SITE_MODE
        value: beta
      - key: SITE_URL
        value: https://www.facetpro.co.uk

      # Required. Without this the installer area returns 503 and serves nothing.
      - key: INSTALLER_PASSWORD
        sync: false

      # Required for detection and renders. Without them both endpoints return
      # a clear error rather than crashing.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: REPLICATE_API_TOKEN
        sync: false

      # Lead email. Without a verified sending domain nothing is delivered —
      # see DEPLOY.md.
      - key: RESEND_API_KEY
        sync: false
      - key: LEAD_NOTIFY_EMAIL
        sync: false
      - key: LEAD_FROM_EMAIL
        sync: false

      # Spend caps. These are the only thing bounding the Anthropic and
      # Replicate bill — set them deliberately.
      - key: DAILY_DETECT_LIMIT
        value: "50"
      - key: DAILY_RENDER_LIMIT
        value: "50"
